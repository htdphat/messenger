<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+Symbols+2&family=Noto+Sans+Symbols&family=Noto+Sans+Math&display=swap">
<title>Messenger – Đoạn chat</title>
<style>
:root{--bg:#fff;--bg2:#f0f2f5;--tx:#050505;--tx2:#65676b;--me:#0084ff;--meTx:#fff;--ot:#e4e6eb;--line:#dadde1;--sel:#ebf5ff;--hover:#f2f2f2}
@media(prefers-color-scheme:dark){:root{--bg:#18191a;--bg2:#242526;--tx:#e4e6eb;--tx2:#b0b3b8;--ot:#3a3b3c;--line:#3e4042;--sel:#263951;--hover:#2f3031}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.34 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols","Noto Sans Math","Arial Unicode MS","MS Gothic",sans-serif}
.em{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-variant-emoji:emoji}
.wj{display:none}
#app{display:flex;height:100%}
.side{width:360px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column}
.side h1{font-size:24px;margin:0;padding:16px 16px 8px}
.list{overflow:auto;padding:0 8px}
.item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--hover)}.item.on{background:var(--sel)}
.item .t{min-width:0;flex:1}
.item b{display:block;font-weight:600;font-size:15px}
.item small{display:flex;gap:6px;color:var(--tx2);font-size:13px}
.item small span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small span:last-child{flex:none}
.av{width:36px;height:36px;border-radius:50%;flex:none;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center}
.av.big{width:56px;height:56px;font-size:22px}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);min-height:60px}
.head .av{width:40px;height:40px}
.head b{display:block;font-size:16px}.head small{color:var(--tx2);font-size:12.5px}
.back{display:none;border:0;background:none;color:var(--me);font-size:26px;cursor:pointer;padding:0 6px}
.msgs{flex:1;overflow-y:auto;padding:12px 14px 8px}
.more{text-align:center;color:var(--tx2);font-size:13px;padding:6px}
.sep{text-align:center;color:var(--tx2);font-size:12px;margin:16px 0 8px}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.row.first{margin-top:8px}
.row.me{justify-content:flex-end}
.row.hasrx{margin-bottom:14px}
.row .sp{width:28px;flex:none}
.row .av{width:28px;height:28px;font-size:12px}
.col{max-width:min(65%,560px);display:flex}
.b{position:relative;padding:8px 12px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.ot .b{background:var(--ot)}.me .b{background:var(--me);color:var(--meTx)}
.me .b{border-top-right-radius:18px}
.me.lp .b{border-top-right-radius:4px}.me.ln .b{border-bottom-right-radius:4px}
.ot.lp .b{border-top-left-radius:4px}.ot.ln .b{border-bottom-left-radius:4px}
.b a{color:inherit;text-decoration:underline}
.b.big{background:none!important;color:inherit;font-size:34px;line-height:1.2;padding:0}
.b.md{padding:0;background:none!important;line-height:0}
.b.md img,.b.md video{display:block;max-width:100%;max-height:380px;width:auto;height:auto;cursor:zoom-in;border-radius:inherit;background:var(--bg2);min-width:120px;min-height:120px}
.b.md video{cursor:default;min-height:0}
.b.au{padding:6px 8px;background:var(--ot)!important;line-height:0}.me .b.au{background:var(--me)!important}
.b.au audio{width:250px;max-width:100%;height:36px}
.b.un{background:none!important;border:1px solid var(--line);color:var(--tx2);font-style:italic}
.b.gh{background:none!important;border:1px dashed var(--line);color:var(--tx2);font-style:italic;font-size:13px}
.miss{padding:14px;background:var(--bg2);color:var(--tx2);font-size:12px;line-height:1.4;max-width:260px;word-break:break-all}
.rx{position:absolute;bottom:-12px;right:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 6px;font-size:13px;line-height:20px;color:var(--tx2);white-space:nowrap;box-shadow:0 1px 2px #0002}
.foot{border-top:1px solid var(--line);padding:10px 14px}
.foot div{background:var(--bg2);color:var(--tx2);border-radius:20px;padding:8px 14px}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lb img{max-width:94vw;max-height:94vh}
@media(max-width:760px){.side{width:100%;border:0}.chat{display:none}.open .side{display:none}.open .chat{display:flex}.back{display:block}.col{max-width:78%}}
</style>

  if(!R[lo])return;v={i:+R[lo].dataset.i,o:Math.round(R[lo].getBoundingClientRect().top-bt)}}
 try{localStorage.setItem(KEY(),JSON.stringify(v))}catch(e){}}
